<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>裁库｜2026 千川成片生产台</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #e9ece8; color: #101411; font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; }
    body { width: 3080px; padding: 72px; }
    header { height: 230px; padding: 8px 8px 42px; display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 2px solid #cbd1cc; }
    .eyebrow { margin: 0 0 18px; color: #4f5d55; font: 700 20px/1.2 "Bahnschrift", sans-serif; letter-spacing: .14em; }
    h1 { margin: 0; font-size: 58px; letter-spacing: -.04em; }
    .principle { width: 900px; margin: 0; color: #4b5850; font-size: 25px; line-height: 1.6; text-align: right; }
    main { display: grid; grid-template-columns: repeat(2, 1440px); gap: 48px; padding-top: 48px; }
    figure { margin: 0; overflow: hidden; border: 1px solid #d4d9d5; border-radius: 24px; background: #fff; box-shadow: 0 18px 42px rgba(17, 25, 20, .08); }
    figcaption { height: 76px; display: flex; align-items: center; gap: 18px; padding: 0 26px; border-bottom: 1px solid #e3e7e4; font-size: 24px; font-weight: 800; }
    .num { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 50%; background: #101411; color: #c8f6e8; font: 700 18px/1 "Bahnschrift", sans-serif; }
    img { display: block; width: 1440px; height: 1024px; object-fit: cover; }
    footer { display: flex; justify-content: space-between; align-items: center; padding: 48px 8px 6px; color: #526057; font-size: 22px; }
    .lock { padding: 14px 20px; border: 1px solid #9fcfbe; border-radius: 999px; background: #e8fbf4; color: #145b43; font-weight: 800; }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">CAIKU · QIANCHUAN VIDEO PRODUCTION DESKTOP 2026</p>
      <h1>裁库｜2026 千川成片生产台</h1>
    </div>
    <p class="principle">第一性原则：从可追溯素材出发，完成脚本、AI 配音、多版本混剪与逐条 AI 发布前质检，只有合规成片才能导出。</p>
  </header>
  <main>
    <figure><figcaption><span class="num">01</span>选择素材 · 片段均不少于 2 秒</figcaption><img src="2026_千川成片_01选择素材.png" alt="选择素材" /></figure>
    <figure><figcaption><span class="num">02</span>AI 配音 · 声音、音乐与口播参数</figcaption><img src="2026_千川成片_02AI配音.png" alt="AI配音" /></figure>
    <figure><figcaption><span class="num">03</span>生成设置 · 数量与差异化策略</figcaption><img src="2026_千川成片_03生成设置.png" alt="生成设置" /></figure>
    <figure><figcaption><span class="num">04</span>AI 质检 · 风险定位与导出拦截</figcaption><img src="2026_千川成片_04AI质检风险.png" alt="AI质检风险" /></figure>
    <figure><figcaption><span class="num">05</span>AI 质检 · 全部修复并重新通过</figcaption><img src="2026_千川成片_05AI质检通过.png" alt="AI质检通过" /></figure>
    <figure><figcaption><span class="num">06</span>千川导出 · 文件、报告与参数统一</figcaption><img src="2026_千川成片_06千川导出.png" alt="千川导出" /></figure>
  </main>
  <footer>
    <span>白底黑字 · 中文桌面生产工具 · 删除操作全覆盖 · 四大模块互联</span>
    <span class="lock">固定输出：1080×1920 · 9:16 · MP4 · H.264 · 30 fps</span>
  </footer>
</body>
</html>
